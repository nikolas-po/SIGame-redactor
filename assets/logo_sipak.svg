<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd54f"/>
      <stop offset="100%" style="stop-color:#ff8f00"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- game board cells -->
  <rect x="72" y="88" width="110" height="72" rx="10" fill="#283593"/>
  <rect x="201" y="88" width="110" height="72" rx="10" fill="#3949ab"/>
  <rect x="330" y="88" width="110" height="72" rx="10" fill="#283593"/>
  <rect x="72" y="180" width="110" height="72" rx="10" fill="#3949ab"/>
  <rect x="201" y="180" width="110" height="72" rx="10" fill="url(#gold)"/>
  <rect x="330" y="180" width="110" height="72" rx="10" fill="#3949ab"/>
  <!-- question mark on gold cell -->
  <text x="256" y="232" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="52" font-weight="bold" fill="#1a237e">?</text>
  <!-- name -->
  <text x="256" y="340" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">СиПак</text>
  <text x="256" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#90caf9">редактор пакетов SIGame</text>
</svg>
